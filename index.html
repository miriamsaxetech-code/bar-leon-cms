<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bar León — Plaza Nueva, Granada</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:     #FDFBF7;
      --ink:    #1C1A17;
      --accent: #7A1C1C;
      --muted:  #6B6560;
      --faint:  rgba(122, 28, 28, 0.16);
    }

    html, body {
      overflow-x: hidden;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.65;
    }

    /* ─── LOADER ─── */
    #loader {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.3rem;
      color: var(--ink);
      letter-spacing: 0.01em;
      transition: opacity 0.35s ease;
    }

    #loader.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* ─── LAYOUT ─── */
    #app {
      padding-top: 68px;
      padding-bottom: 80px;
    }

    .wrap {
      max-width: 860px;
      margin: 0 auto;
      padding: 0 28px;
    }

    hr.divider {
      border: none;
      border-top: 1px solid var(--accent);
      margin: 75px 0;
    }

    /* ─── TYPOGRAPHY ─── */
    h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      line-height: 1.1;
      font-size: clamp(2.6rem, 7vw, 3.8rem);
      text-align: left;
    }

    h2 {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      line-height: 1.1;
      font-size: 0.95rem;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    /* ─── CTA BUTTON — full viewport width ─── */
    .cta-btn {
      display: block;
      width: 100%;
      background: var(--ink);
      color: var(--bg);
      text-align: center;
      font-family: 'Inter', system-ui, sans-serif;
      font-weight: 600;
      font-size: 0.9rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 22px 28px;
      border: none;
      border-radius: 0;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .cta-btn:hover,
    .cta-btn:focus-visible {
      background: #38352f;
      outline: none;
    }

    /* ─── HERO ─── */
    .hero-meta {
      margin-bottom: 18px;
    }

    .hero h1 {
      margin-bottom: 20px;
    }

    .bajada {
      font-size: 1.05rem;
      color: var(--ink);
      max-width: 560px;
      line-height: 1.8;
      margin-bottom: 40px;
    }

    .aviso {
      font-size: 0.9rem;
      color: var(--accent);
      font-style: italic;
      margin-bottom: 28px;
    }

    /* ─── HERO IMAGE FRAME ─── */
    .hero-frame {
      width: 100%;
      margin-top: 32px;
      margin-bottom: 40px;
      border: 1px solid var(--ink);
      border-radius: 0;
      overflow: hidden;
      line-height: 0;
    }

    .hero-frame img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 0;
      object-fit: cover;
      aspect-ratio: 16 / 9;
    }

    .hero-frame--placeholder {
      aspect-ratio: 16 / 9;
      background: #EAE5DC;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      line-height: 1;
    }

    /* ─── MENÚ DEL DÍA — EDICT ─── */
    .edict {
      border: 2px solid var(--accent);
    }

    .edict-head {
      border-bottom: 1px solid var(--accent);
      padding: 26px 32px 22px;
      text-align: center;
    }

    .edict-head h2 {
      text-align: center;
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .edict-title {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: 1.6rem;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .edict-price {
      display: block;
      font-family: 'Courier New', Courier, monospace;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 6px;
    }

    .edict-dias {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
    }

    .edict-body {
      padding: 22px 32px 26px;
    }

    .edict-condiciones {
      font-size: 0.9rem;
      color: var(--ink);
      line-height: 1.75;
    }

    .edict-key {
      display: block;
      font-weight: 700;
      margin-top: 10px;
      font-size: 0.9rem;
    }

    .edict-foot {
      border-top: 1px solid var(--faint);
      padding: 12px 32px;
      text-align: right;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
    }

    /* ─── CARTA ─── */
    .categoria-head {
      padding-bottom: 10px;
      border-bottom: 2px solid var(--ink);
      margin-bottom: 0;
    }

    .categoria-head h2 {
      font-size: 0.82rem;
      letter-spacing: 0.2em;
      color: var(--ink);
      line-height: 1;
    }

    .carta-item {
      padding: 16px 0;
      border-bottom: 1px solid rgba(28, 26, 23, 0.14);
    }

    .carta-item:last-child {
      border-bottom: none;
    }

    /* guest check row — printed-menu style */
    .check-row {
      display: flex;
      align-items: baseline;
      margin-bottom: 4px;
    }

    .check-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: 1.05rem;
      line-height: 1.25;
      white-space: nowrap;
      flex-shrink: 0;
      color: var(--ink);
      margin-right: 3px;
    }

    .check-leader {
      flex: 1;
      overflow: hidden;
      height: 1.25em;
      white-space: nowrap;
      color: rgba(28, 26, 23, 0.3);
      font-size: 0.82rem;
      padding: 0 3px;
    }

    .check-leader::after {
      content: " . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . . .";
    }

    .check-price {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      flex-shrink: 0;
      color: var(--ink);
      margin-left: 3px;
    }

    .item-en {
      font-style: italic;
      color: var(--accent);
      font-size: 0.82rem;
      margin-bottom: 5px;
      line-height: 1.4;
    }

    .item-desc {
      font-size: 0.84rem;
      color: var(--muted);
      line-height: 1.65;
      margin-bottom: 8px;
    }

    .item-maridaje {
      font-style: italic;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.5;
    }

    /* ─── HORARIOS ─── */
    .horarios-grid {
      display: grid;
      grid-template-columns: 148px 1fr;
      border: 1px solid var(--accent);
    }

    .h-dia,
    .h-det {
      padding: 11px 18px;
      font-size: 0.88rem;
      border-bottom: 1px solid var(--faint);
    }

    .h-dia {
      font-weight: 600;
      border-right: 1px solid var(--faint);
    }

    /* remove border from last row */
    .horarios-grid > div:nth-last-child(-n+2) {
      border-bottom: none;
    }

    .h-cerrado {
      font-weight: 700;
      text-transform: uppercase;
      color: var(--accent);
      letter-spacing: 0.05em;
      font-size: 0.78rem;
    }

    /* ─── FOOTER ─── */
    .footer-address {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted);
      line-height: 2.1;
      text-align: center;
      margin-bottom: 32px;
    }

    .footer-brand {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 0.82rem;
      color: var(--muted);
      text-align: center;
      margin-top: 24px;
      letter-spacing: 0.04em;
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 540px) {
      .wrap { padding: 0 20px; }
      .edict-head,
      .edict-body,
      .edict-foot { padding-left: 20px; padding-right: 20px; }
      .horarios-grid { grid-template-columns: 108px 1fr; }
      .h-dia, .h-det { padding: 10px 14px; font-size: 0.82rem; }
    }
  </style>
</head>
<body>

<div id="loader">Abriendo la carta&hellip;</div>
<main id="app" style="display:none"></main>

<script>
(function () {
  'use strict';

  const PHONE = 'tel:+34958225143';

  /* Force correct spelling of Albayzín regardless of source data */
  function albayzin(str) {
    if (!str) return str;
    return str.replace(/albay[cz][íi]n/gi, function (m) {
      return m.charAt(0) === m.charAt(0).toUpperCase() ? 'Albayzín' : 'albayzín';
    });
  }

  function cta(label) {
    return `<a href="${PHONE}" class="cta-btn" aria-label="${label}">${label}</a>`;
  }

  function divider() {
    return `<div class="wrap"><hr class="divider" /></div>`;
  }

  /* ─── HERO ─── */
  function renderHero(inicio) {
    const bajada = albayzin(inicio.bajada || '');
    const aviso  = inicio.avisoEspecial
      ? `<p class="aviso">${inicio.avisoEspecial}</p>`
      : '';

    const heroImg = `
<div class="hero-frame" role="img" aria-label="Bar León — Plaza Nueva, Granada">
  <img
    src="assets/images/hero-bg.jpg"
    alt="Bar León — Plaza Nueva, Granada"
    onerror="this.parentElement.classList.add('hero-frame--placeholder'); this.parentElement.innerHTML='<span>Foto del local — próximamente</span>';"
  />
</div>`;

    return `
<section>
  <div class="wrap hero">
    <p class="label hero-meta">Bar León &middot; Plaza Nueva &middot; Granada</p>
    <h1>${inicio.titular}</h1>
    <p class="bajada">${bajada}</p>
    ${aviso}
    ${heroImg}
  </div>
  ${cta('Llamar al Bar')}
</section>`;
  }

  /* ─── MENÚ DEL DÍA ─── */
  function renderMenuDia(m) {
    if (m.disponible !== 'SI') return '';
    return `
<section>
  <div class="wrap">
    <p class="label" style="margin-bottom:16px">Menú del Día</p>
    <div class="edict">
      <div class="edict-head">
        <h2>Establecimiento Bar León &middot; Granada</h2>
        <p class="edict-title">Menú del Día</p>
        <span class="edict-price">${m.precio}</span>
        <p class="edict-dias">${m.dias}</p>
      </div>
      <div class="edict-body">
        <p class="edict-condiciones">
          ${m.condiciones}
          <strong class="edict-key">Postre incluido. Bebida NO incluida.</strong>
        </p>
      </div>
      <div class="edict-foot">Bar León &middot; Cocina Tradicional Granadina</div>
    </div>
  </div>
</section>`;
  }

  /* ─── CARTA ─── */
  function renderCarta(items) {
    const available = items.filter(i => i.disponible !== 'NO');

    /* group preserving insertion order */
    const groups = {};
    available.forEach(i => {
      if (!groups[i.categoria]) groups[i.categoria] = [];
      groups[i.categoria].push(i);
    });

    const cats = Object.entries(groups).map(([cat, list], idx) => {
      const sep = idx > 0 ? '<hr class="divider" style="margin:52px 0;" />' : '';
      const itemsHtml = list.map(item => `
<article class="carta-item">
  <div class="check-row">
    <span class="check-name">${item.nombreES}</span>
    <span class="check-leader" aria-hidden="true"></span>
    <span class="check-price">${item.precio}</span>
  </div>
  <p class="item-en">${item.nombreEN}</p>
  <p class="item-desc">${item.descripcionEN}</p>
  <p class="item-maridaje">${item.maridaje}</p>
</article>`).join('');

      return `${sep}
<div>
  <div class="categoria-head" style="margin-bottom:0">
    <h2>${cat}</h2>
  </div>
  <div>${itemsHtml}</div>
</div>`;
    });

    return `
<section>
  <div class="wrap">${cats.join('')}</div>
</section>`;
  }

  /* ─── HORARIOS ─── */
  function renderHorarios(horarios) {
    const cells = horarios.map(h => {
      const closed = h.estado === 'CERRADO' || h.estado === 'CERRADO TARDE';
      const cls = closed ? ' h-cerrado' : '';
      return `
<div class="h-dia${cls}">${h.dia}</div>
<div class="h-det${cls}">${h.detalle}</div>`;
    }).join('');

    return `
<section>
  <div class="wrap">
    <p class="label" style="margin-bottom:16px">Horario</p>
    <div class="horarios-grid" role="table" aria-label="Horario Bar León">${cells}</div>
  </div>
</section>`;
  }

  /* ─── FOOTER ─── */
  function renderFooter() {
    return `
<footer>
  <div class="wrap">
    <p class="footer-address">
      Plaza Nueva &middot; Granada &middot; Andaluc&iacute;a<br />
      Cocina Tradicional &middot; Tres Generaciones
    </p>
  </div>
  ${cta('Llamar al Bar')}
  <div class="wrap">
    <p class="footer-brand">Bar Le&oacute;n</p>
  </div>
</footer>`;
  }

  /* ─── INIT ─── */
  async function init() {
    const loader = document.getElementById('loader');
    const app    = document.getElementById('app');

    try {
      const res = await fetch('./data.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const d = await res.json();

      app.innerHTML = [
        renderHero(d.inicio),
        divider(),
        renderMenuDia(d.menuDia),
        divider(),
        renderCarta(d.carta),
        divider(),
        renderHorarios(d.horarios),
        divider(),
        renderFooter(),
      ].join('\n');

      app.style.display = 'block';
      loader.classList.add('fade-out');
      setTimeout(() => { loader.style.display = 'none'; }, 380);

    } catch (err) {
      loader.innerHTML = '<span style="color:#7A1C1C;font-family:Georgia,serif;font-size:0.95rem;padding:0 24px;text-align:center;display:block;">Error al cargar la carta. Por favor, recarga la p&aacute;gina.</span>';
      console.error('Bar León CMS:', err);
    }
  }

  init();
}());
</script>
</body>
</html>
