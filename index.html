<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurante Bar León — Granada</title>
  <meta name="robots" content="noindex, follow" />
  <link rel="icon" href="/assets/images/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/images/favicon-16x16.png" type="image/png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <link rel="alternate" hreflang="es" href="/es/" />
  <link rel="alternate" hreflang="en" href="/en/" />
  <link rel="alternate" hreflang="fr" href="/fr/" />
  <link rel="alternate" hreflang="x-default" href="/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Granaina Limpia';
      src: url('/assets/fonts/granaina-limpia.woff2') format('woff2'),
           url('/assets/fonts/granaina-limpia.otf') format('opentype');
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      /* Family portrait — warm sepia paper, faces centered */
      background-color: #E8E0D0;
      background-image: url('/assets/images/header-leon.webp');
      background-size: cover;
      background-position: center 38%;
      background-repeat: no-repeat;
    }

    /* Archival veil — cream at 75%, lets the pencil faces ghost through */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(242, 237, 228, 0.75);
      pointer-events: none;
    }

    .picker {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 60px 40px 52px;
      text-align: center;
      max-width: 380px;
      width: 100%;
    }

    .picker__logo {
      height: 84px;
      width: auto;
      opacity: 0.82;
      margin-bottom: 6px;
    }

    .picker__name {
      font-family: 'Granaina Limpia', Georgia, serif;
      font-size: 25px;
      font-weight: normal;
      color: #0F0D0B;
      line-height: 1.15;
      letter-spacing: 0.5px;
    }

    .picker__sub {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 8.5px;
      letter-spacing: 3.5px;
      color: #3C3834;
      text-transform: uppercase;
      margin-top: -8px;
    }

    /* Status — editorial note, no pill, no color signal */
    .picker__status-container {
      margin-top: 2px;
    }

    .status-note {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 8px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(15, 13, 11, 0.42);
    }

    .picker__divider {
      width: 40px;
      height: 1px;
      background: rgba(15, 13, 11, 0.24);
    }

    /* Language selector — typographic, printed-material feeling */
    .picker__langs {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    .picker__lang {
      font-family: 'Granaina Limpia', Georgia, serif;
      font-size: 16px;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: #0F0D0B;
      cursor: pointer;
      padding: 10px 18px;
      border: none;
      background: none;
      line-height: 1;
      transition: color 0.15s;
    }

    .picker__lang:hover,
    .picker__lang:focus-visible {
      color: #7A1C1C;
      outline: none;
    }

    .picker__lang-sep {
      color: rgba(15, 13, 11, 0.2);
      font-size: 11px;
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      var saved = localStorage.getItem('lang');
      if (saved === 'es' || saved === 'en' || saved === 'fr') {
        location.replace('/' + saved + '/');
      }
    }());
  </script>

  <div class="picker">
    <img class="picker__logo" src="/assets/images/lion-logo.svg" alt="Bar León" />
    <div>
      <div class="picker__name">Restaurante Bar León</div>
      <div class="picker__sub">Albayzín &middot; Granada &middot; 1959</div>
    </div>

    <div id="status-container" class="picker__status-container" style="display: none;">
      <span id="status-text" class="status-note"></span>
    </div>

    <div class="picker__divider"></div>

    <div class="picker__langs">
      <button class="picker__lang" onclick="pick('es')">ES</button>
      <span class="picker__lang-sep" aria-hidden="true">·</span>
      <button class="picker__lang" onclick="pick('en')">EN</button>
      <span class="picker__lang-sep" aria-hidden="true">·</span>
      <button class="picker__lang" onclick="pick('fr')">FR</button>
    </div>
  </div>

  <script>
    function pick(lang) {
      localStorage.setItem('lang', lang);
      location.href = '/' + lang + '/';
    }

    fetch('/data/venue.json')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (!data || !data.hours) return;
        var now = new Date();
        var dayKeys = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
        var todayKey = dayKeys[now.getDay()];
        var todayEntry = data.hours.find(function(h) { return h.day === todayKey; });

        var isOpen = false;
        if (todayEntry && todayEntry.status !== 'closed' && todayEntry.periods && todayEntry.periods.length) {
          var nowMins = now.getHours() * 60 + now.getMinutes();
          isOpen = todayEntry.periods.some(function(p) {
            var toMins = function(str) {
              var s = str.split(':');
              return parseInt(s[0], 10) * 60 + parseInt(s[1], 10);
            };
            return nowMins >= toMins(p.open) && nowMins < toMins(p.close);
          });
        }

        var container = document.getElementById('status-container');
        var textSpan = document.getElementById('status-text');
        var userLang = (navigator.language || '').slice(0, 2);
        var statusLabels = {
          es: { open: 'abierto', closed: 'cerrado' },
          en: { open: 'open', closed: 'closed' },
          fr: { open: 'ouvert', closed: 'fermé' }
        };
        var labels = statusLabels[userLang] || statusLabels.es;
        textSpan.textContent = isOpen ? labels.open : labels.closed;
        container.style.display = 'block';
      })
      .catch(function() {});
  </script>
</body>
</html>
