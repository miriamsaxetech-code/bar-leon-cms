<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurante Bar León — Granada</title>
  <link rel="icon" href="/assets/images/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/images/favicon-16x16.png" type="image/png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <link rel="alternate" hreflang="es" href="/es/" />
  <link rel="alternate" hreflang="en" href="/en/" />
  <link rel="alternate" hreflang="fr" href="/fr/" />
  <link rel="alternate" hreflang="x-default" href="/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Granaina Limpia';
      src: url('/assets/fonts/granaina-limpia.otf') format('opentype');
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #F6F3EC;
      background-image: url('/assets/images/web/bar-leon-plato-01.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Cream overlay so text stays legible */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(246, 243, 236, 0.88);
      pointer-events: none;
    }

    .picker {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 56px 40px;
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    .picker__logo {
      height: 88px;
      width: auto;
      opacity: 0.9;
      margin-bottom: 8px;
    }

    .picker__name {
      font-family: 'Granaina Limpia', Georgia, serif;
      font-size: 26px;
      font-weight: normal;
      color: #1C1A17;
      line-height: 1.15;
      letter-spacing: 0.5px;
    }

    .picker__sub {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 9px;
      letter-spacing: 3.5px;
      color: #5C5752;
      text-transform: uppercase;
      margin-top: -10px;
    }

    .picker__status-container {
      margin-top: 4px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 9px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: rgba(28, 26, 23, 0.05);
      border: 1px solid rgba(28, 26, 23, 0.12);
      color: #1C1A17;
      transition: all 0.2s ease;
    }

    .status-badge--open {
      background: rgba(46, 125, 50, 0.08);
      border-color: rgba(46, 125, 50, 0.3);
      color: #2E7D32;
    }

    .status-badge--closed {
      background: rgba(198, 40, 40, 0.08);
      border-color: rgba(198, 40, 40, 0.3);
      color: #C62828;
    }

    .status-badge__dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: currentColor;
    }

    .picker__divider {
      width: 48px;
      height: 1px;
      background: #B8B3AA;
    }

    .picker__langs {
      display: flex;
      justify-content: center;
      gap: 8px;
      width: 100%;
    }

    .picker__btn {
      padding: 10px 28px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #1C1A17;
      background: transparent;
      border: 1px solid rgba(28, 26, 23, 0.55);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }

    .picker__btn:hover {
      background: #7A1C1C;
      color: #F6F3EC;
      border-color: #7A1C1C;
    }

    .picker__caption {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 9px;
      letter-spacing: 2.5px;
      color: #7A1C1C;
      text-transform: uppercase;
      margin-top: -4px;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      var saved = localStorage.getItem('lang');
      if (saved === 'es' || saved === 'en' || saved === 'fr') {
        location.replace('/' + saved + '/');
      }
    }());
  </script>

  <div class="picker">
    <img class="picker__logo" src="/assets/images/lion-logo.svg" alt="Bar León" />
    <div>
      <div class="picker__name">Restaurante Bar León</div>
      <div class="picker__sub">Albayzín &middot; Granada &middot; 1959</div>
    </div>

    <div id="status-container" class="picker__status-container" style="display: none;">
      <span id="status-badge" class="status-badge">
        <span class="status-badge__dot"></span>
        <span id="status-text" class="status-badge__text"></span>
      </span>
    </div>

    <div class="picker__divider"></div>
    <div class="picker__langs">
      <button class="picker__btn" onclick="pick('es')">ES</button>
      <button class="picker__btn" onclick="pick('en')">EN</button>
      <button class="picker__btn" onclick="pick('fr')">FR</button>
    </div>
    <div class="picker__caption">Elige tu idioma</div>
  </div>

  <script>
    function pick(lang) {
      localStorage.setItem('lang', lang);
      location.href = '/' + lang + '/';
    }

    // Fetch opening hours status dynamically
    fetch('/data/venue.json')
      .then(function(res) { return res.json(); })
      .then(function(data) {
        if (!data || !data.hours) return;
        const now = new Date();
        const dayKeys = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
        const todayKey = dayKeys[now.getDay()];
        const todayEntry = data.hours.find(h => h.day === todayKey);

        let isOpen = false;
        if (todayEntry && todayEntry.status !== 'closed' && todayEntry.periods && todayEntry.periods.length) {
          const nowMins = now.getHours() * 60 + now.getMinutes();
          isOpen = todayEntry.periods.some(function(p) {
            const parts = function(str) {
              const s = str.split(':');
              return parseInt(s[0], 10) * 60 + parseInt(s[1], 10);
            };
            return nowMins >= parts(p.open) && nowMins < parts(p.close);
          });
        }

        const container = document.getElementById('status-container');
        const badge = document.getElementById('status-badge');
        const textSpan = document.getElementById('status-text');

        if (isOpen) {
          badge.classList.add('status-badge--open');
          textSpan.textContent = 'Abierto ahora';
        } else {
          badge.classList.add('status-badge--closed');
          textSpan.textContent = 'Cerrado ahora';
        }
        container.style.display = 'block';
      })
      .catch(function(err) {
        console.error('Error fetching venue status:', err);
      });
  </script>
</body>
</html>
