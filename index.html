<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurante Bar León — Granada</title>
  <link rel="icon" href="/assets/images/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/images/favicon-16x16.png" type="image/png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <link rel="alternate" hreflang="es" href="/es/" />
  <link rel="alternate" hreflang="en" href="/en/" />
  <link rel="alternate" hreflang="fr" href="/fr/" />
  <link rel="alternate" hreflang="x-default" href="/" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    @font-face {
      font-family: 'Granaina Limpia';
      src: url('/assets/fonts/granaina-limpia.otf') format('opentype');
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: #F6F3EC;
      background-image: url('/assets/images/hero-leon.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Cream overlay so text stays legible */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: rgba(246, 243, 236, 0.88);
      pointer-events: none;
    }

    .picker {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding: 56px 40px;
      text-align: center;
      max-width: 400px;
      width: 100%;
    }

    .picker__logo {
      height: 88px;
      width: auto;
      opacity: 0.9;
    }

    .picker__name {
      font-family: 'Granaina Limpia', Georgia, serif;
      font-size: 26px;
      font-weight: normal;
      color: #1C1A17;
      line-height: 1.15;
      letter-spacing: 0.5px;
    }

    .picker__sub {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 9px;
      letter-spacing: 3.5px;
      color: #5C5752;
      text-transform: uppercase;
      margin-top: -10px;
    }

    .picker__divider {
      width: 48px;
      height: 1px;
      background: #B8B3AA;
    }

    .picker__langs {
      display: flex;
      gap: 8px;
    }

    .picker__btn {
      padding: 10px 28px;
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #1C1A17;
      background: transparent;
      border: 1px solid rgba(28, 26, 23, 0.55);
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      white-space: nowrap;
    }

    .picker__btn:hover {
      background: #7A1C1C;
      color: #F6F3EC;
      border-color: #7A1C1C;
    }

    .picker__caption {
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 9px;
      letter-spacing: 2.5px;
      color: #7A1C1C;
      text-transform: uppercase;
      margin-top: -4px;
    }
  </style>
</head>
<body>
  <script>
    (function () {
      var saved = localStorage.getItem('lang');
      if (saved === 'es' || saved === 'en' || saved === 'fr') {
        location.replace('/' + saved + '/');
      }
    }());
  </script>

  <div class="picker">
    <img class="picker__logo" src="/assets/images/lion-logo.svg" alt="Bar León" />
    <div>
      <div class="picker__name">Restaurante Bar León</div>
      <div class="picker__sub">Albayzín &middot; Granada &middot; 1959</div>
    </div>
    <div class="picker__divider"></div>
    <div class="picker__langs">
      <button class="picker__btn" onclick="pick('es')">ES</button>
      <button class="picker__btn" onclick="pick('en')">EN</button>
      <button class="picker__btn" onclick="pick('fr')">FR</button>
    </div>
    <div class="picker__caption">Elige tu idioma</div>
  </div>

  <script>
    function pick(lang) {
      localStorage.setItem('lang', lang);
      location.href = '/' + lang + '/';
    }
  </script>
</body>
</html>
