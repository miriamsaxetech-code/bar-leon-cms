<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restaurante Bar León — Granada</title>
  <meta name="description" content="Restaurante Bar León en Granada. Elige idioma para entrar o consulta directamente la carta." />
  <link rel="icon" href="/assets/images/favicon.ico" sizes="any" />
  <link rel="icon" href="/assets/images/favicon-16x16.png" type="image/png" sizes="16x16" />
  <link rel="apple-touch-icon" href="/assets/images/apple-touch-icon.png" />
  <link rel="canonical" href="https://restaurantebarleon.com/" />
  <link rel="alternate" hreflang="es" href="https://restaurantebarleon.com/es/" />
  <link rel="alternate" hreflang="en" href="https://restaurantebarleon.com/en/" />
  <link rel="alternate" hreflang="fr" href="https://restaurantebarleon.com/fr/" />
  <link rel="alternate" hreflang="x-default" href="https://restaurantebarleon.com/" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      color-scheme: light;
      --paper: #F6F3EC;
      --ink: #1C1A17;
      --muted: #5C5752;
      --blue: #1D4D85;
    }

    html {
      background: var(--paper);
    }

    body {
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    .gateway {
      width: 100%;
      max-width: 480px;
      min-width: 0;
      text-align: center;
    }

    .gateway__azulejo {
      display: block;
      width: min(100%, 380px);
      aspect-ratio: 994 / 646;
      margin: 0 auto 24px;
      overflow: hidden;
      border: 1px solid rgba(29, 77, 133, 0.34);
      box-shadow:
        0 0 0 7px var(--paper),
        0 0 0 8px rgba(29, 77, 133, 0.16),
        0 8px 24px rgba(28, 26, 23, 0.09);
    }

    .gateway__azulejo img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: clamp(1.65rem, 7vw, 2.5rem);
      font-weight: 700;
      line-height: 1.05;
      letter-spacing: 0.01em;
      text-wrap: balance;
    }

    h1::after {
      content: '';
      display: block;
      width: 36px;
      height: 1px;
      margin: 18px auto 20px;
      background: var(--blue);
      opacity: 0.55;
    }

    .gateway__languages {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      min-width: 0;
      border: 1px solid rgba(29, 77, 133, 0.28);
    }

    .gateway__language {
      min-height: 48px;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 8px;
      border-right: 1px solid rgba(29, 77, 133, 0.18);
      color: var(--ink);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .gateway__language:last-child {
      border-right: 0;
    }

    .gateway__language:hover,
    .gateway__language:focus-visible {
      background: var(--blue);
      color: #fff;
      outline: none;
    }

    .gateway__menu {
      display: inline-block;
      margin-top: 20px;
      color: var(--muted);
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-decoration: underline;
      text-underline-offset: 4px;
      text-transform: uppercase;
    }

    .gateway__menu:hover,
    .gateway__menu:focus-visible {
      color: var(--blue);
    }

    @media (max-width: 380px) {
      body {
        padding-inline: 16px;
      }

      .gateway__language {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <main class="gateway">
    <picture class="gateway__azulejo">
      <source srcset="/assets/images/hero-leon.webp" type="image/webp" />
      <img src="/assets/images/hero-leon.png" alt="Azulejo de Restaurante Bar León" width="994" height="646" fetchpriority="high" />
    </picture>
    <h1>Restaurante Bar León</h1>
    <nav class="gateway__languages" aria-label="Idioma">
      <a class="gateway__language" href="/es/" lang="es">Español</a>
      <a class="gateway__language" href="/en/" lang="en">English</a>
      <a class="gateway__language" href="/fr/" lang="fr">Français</a>
    </nav>
    <a class="gateway__menu" href="/es/carta">Ver la carta</a>
  </main>
</body>
</html>
