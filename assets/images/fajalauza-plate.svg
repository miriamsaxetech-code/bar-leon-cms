<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="scallop">
      <path d="M 100 12 C 102 16, 101 20, 97.9 24" stroke="#1D4D85" stroke-width="1.8" fill="none" stroke-linecap="round"/>
      <path d="M 101.5 13.5 C 103 16.5, 102 20, 99.4 23.5" stroke="#2D8C4E" stroke-width="1.2" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- Plate background -->
  <circle cx="100" cy="100" r="95" fill="#FBF9F5" stroke="#1D4D85" stroke-width="2.5" />
  <circle cx="100" cy="100" r="92" fill="none" stroke="#2D8C4E" stroke-width="1" opacity="0.6"/>

  <!-- Inner border -->
  <circle cx="100" cy="100" r="76" fill="none" stroke="#1D4D85" stroke-width="1.8" />

  <!-- Scalloped rim border (36 loops rotated by 10 degrees) -->
  <g>
    <use href="#scallop" transform="rotate(0, 100, 100)" />
    <use href="#scallop" transform="rotate(10, 100, 100)" />
    <use href="#scallop" transform="rotate(20, 100, 100)" />
    <use href="#scallop" transform="rotate(30, 100, 100)" />
    <use href="#scallop" transform="rotate(40, 100, 100)" />
    <use href="#scallop" transform="rotate(50, 100, 100)" />
    <use href="#scallop" transform="rotate(60, 100, 100)" />
    <use href="#scallop" transform="rotate(70, 100, 100)" />
    <use href="#scallop" transform="rotate(80, 100, 100)" />
    <use href="#scallop" transform="rotate(90, 100, 100)" />
    <use href="#scallop" transform="rotate(100, 100, 100)" />
    <use href="#scallop" transform="rotate(110, 100, 100)" />
    <use href="#scallop" transform="rotate(120, 100, 100)" />
    <use href="#scallop" transform="rotate(130, 100, 100)" />
    <use href="#scallop" transform="rotate(140, 100, 100)" />
    <use href="#scallop" transform="rotate(150, 100, 100)" />
    <use href="#scallop" transform="rotate(160, 100, 100)" />
    <use href="#scallop" transform="rotate(170, 100, 100)" />
    <use href="#scallop" transform="rotate(180, 100, 100)" />
    <use href="#scallop" transform="rotate(190, 100, 100)" />
    <use href="#scallop" transform="rotate(200, 100, 100)" />
    <use href="#scallop" transform="rotate(210, 100, 100)" />
    <use href="#scallop" transform="rotate(220, 100, 100)" />
    <use href="#scallop" transform="rotate(230, 100, 100)" />
    <use href="#scallop" transform="rotate(240, 100, 100)" />
    <use href="#scallop" transform="rotate(250, 100, 100)" />
    <use href="#scallop" transform="rotate(260, 100, 100)" />
    <use href="#scallop" transform="rotate(270, 100, 100)" />
    <use href="#scallop" transform="rotate(280, 100, 100)" />
    <use href="#scallop" transform="rotate(290, 100, 100)" />
    <use href="#scallop" transform="rotate(300, 100, 100)" />
    <use href="#scallop" transform="rotate(310, 100, 100)" />
    <use href="#scallop" transform="rotate(320, 100, 100)" />
    <use href="#scallop" transform="rotate(330, 100, 100)" />
    <use href="#scallop" transform="rotate(340, 100, 100)" />
    <use href="#scallop" transform="rotate(350, 100, 100)" />
  </g>

  <!-- Symmetrical scrolls -->
  <!-- Left stem scroll -->
  <path d="M100,134 C80,134 60,126 50,110 C40,94 40,78 54,64 C64,54 78,56 80,66 C82,76 72,82 66,78 C60,74 62,64 68,62" stroke="#1D4D85" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Right stem scroll -->
  <path d="M100,134 C120,134 140,126 150,110 C160,94 160,78 146,64 C136,54 122,56 120,66 C118,76 128,82 134,78 C140,74 138,64 132,62" stroke="#1D4D85" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Left scroll leaves -->
  <path d="M52,118 C46,110 44,104 46,96 C50,102 54,108 58,112 Z" fill="#1D4D85"/>
  <path d="M44,98 C38,90 38,82 42,74 C46,80 50,86 52,92 Z" fill="#2D8C4E"/>
  <path d="M50,78 C46,70 48,62 54,56 C56,64 56,72 54,76 Z" fill="#1D4D85"/>
  <path d="M68,58 C68,50 72,44 80,44 C78,52 74,58 70,60 Z" fill="#2D8C4E"/>
  <path d="M84,68 C88,62 94,60 98,64 C92,68 88,72 86,74 Z" fill="#1D4D85"/>

  <!-- Right scroll leaves -->
  <path d="M148,118 C154,110 156,104 154,96 C150,102 146,108 142,112 Z" fill="#1D4D85"/>
  <path d="M156,98 C162,90 162,82 158,74 C154,80 150,86 148,92 Z" fill="#2D8C4E"/>
  <path d="M150,78 C154,70 152,62 146,56 C144,64 144,72 146,76 Z" fill="#1D4D85"/>
  <path d="M132,58 C132,50 128,44 120,44 C122,52 126,58 130,60 Z" fill="#2D8C4E"/>
  <path d="M116,68 C112,62 106,60 102,64 C108,68 112,72 114,74 Z" fill="#1D4D85"/>

  <!-- Bottom minor scrolls -->
  <path d="M100,126 C88,126 78,132 74,138 C70,144 72,150 78,150 C84,150 88,144 86,138" stroke="#2D8C4E" stroke-width="1.5" fill="none"/>
  <path d="M100,126 C112,126 122,132 126,138 C130,144 128,150 122,150 C116,150 112,144 114,138" stroke="#2D8C4E" stroke-width="1.5" fill="none"/>

  <!-- Bottom minor leaves -->
  <path d="M72,134 C64,132 58,134 54,140 C60,142 66,140 70,136 Z" fill="#1D4D85"/>
  <path d="M80,146 C80,154 84,158 90,158 C88,150 84,146 82,144 Z" fill="#2D8C4E"/>
  <path d="M128,134 C136,132 142,134 146,140 C140,142 134,140 130,136 Z" fill="#1D4D85"/>
  <path d="M120,146 C120,154 116,158 110,158 C112,150 116,146 118,144 Z" fill="#2D8C4E"/>

  <!-- Central stem -->
  <path d="M100,142 C100,132 100,122 100,114" stroke="#1D4D85" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Pomegranate fruit body -->
  <path d="M100,72 C114,72 122,82 120,95 C118,106 109,114 100,114 C91,114 82,106 80,95 C78,82 86,72 100,72 Z" fill="#FBF9F5" stroke="#1D4D85" stroke-width="2.5" />
  
  <!-- Opened pulp outline -->
  <path d="M100,80 C108,80 112,87 110,95 C108,102 103,106 100,106 C97,106 92,102 90,95 C88,87 92,80 100,80 Z" fill="#2D8C4E" fill-opacity="0.15" stroke="#2D8C4E" stroke-width="1.5" />

  <!-- Seeds (blue circles) -->
  <circle cx="97" cy="88" r="1.8" fill="#1D4D85"/>
  <circle cx="103" cy="88" r="1.8" fill="#1D4D85"/>
  <circle cx="95" cy="94" r="1.8" fill="#1D4D85"/>
  <circle cx="105" cy="94" r="1.8" fill="#1D4D85"/>
  <circle cx="100" cy="91" r="1.8" fill="#1D4D85"/>
  <circle cx="100" cy="99" r="1.8" fill="#1D4D85"/>

  <!-- Crown petals -->
  <path d="M100,72 L96,62 C97,60 103,60 104,62 Z" fill="#2D8C4E" stroke="#1D4D85" stroke-width="1.5"/>
  <path d="M96,73 L90,66 L94,62 L98,67 Z" fill="#2D8C4E" stroke="#1D4D85" stroke-width="1.5"/>
  <path d="M104,73 L110,66 L106,62 L102,67 Z" fill="#2D8C4E" stroke="#1D4D85" stroke-width="1.5"/>
</svg>
