<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Panel — Bar León</title>
  <link rel="stylesheet" href="/panel/panel.css">
</head>
<body>

  <!-- ═══ PANTALLA DE INICIO DE SESIÓN ═══ -->
  <div id="auth-screen" class="auth-screen" hidden>
    <div class="auth-card">
      <div class="auth-logo">🦁</div>
      <h1 class="auth-title">Panel de Control</h1>
      <p class="auth-subtitle">Bar León · Calle Pan, 1</p>
      <button id="login-btn" class="btn btn--primary btn--full">
        Entrar con GitHub
      </button>
    </div>
  </div>

  <!-- ═══ PANEL PRINCIPAL ═══ -->
  <div id="panel" hidden>

    <header class="panel-header">
      <span class="panel-header__title">Panel León</span>
      <div class="panel-header__right">
        <span id="user-info" class="panel-header__user"></span>
        <button id="logout-btn" class="panel-header__logout">Salir</button>
      </div>
    </header>

    <nav class="panel-tabs" role="tablist" aria-label="Secciones del panel">
      <button class="panel-tab active" data-tab="precios"   role="tab" aria-selected="true"  aria-controls="tab-precios">Precios</button>
      <button class="panel-tab"        data-tab="horarios"  role="tab" aria-selected="false" aria-controls="tab-horarios">Horarios</button>
      <button class="panel-tab"        data-tab="aviso"     role="tab" aria-selected="false" aria-controls="tab-aviso">Aviso</button>
      <button class="panel-tab"        data-tab="carioca"   role="tab" aria-selected="false" aria-controls="tab-carioca">Carioca</button>
    </nav>

    <main class="panel-content">

      <!-- TAB: PRECIOS -->
      <div id="tab-precios" class="tab-panel active" role="tabpanel" aria-labelledby="">
        <div class="tab-search">
          <input
            id="search-precios"
            type="search"
            placeholder="Buscar plato o bebida…"
            class="search-input"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
          >
        </div>
        <div id="precios-list" class="price-list"></div>
      </div>

      <!-- TAB: HORARIOS -->
      <div id="tab-horarios" class="tab-panel" role="tabpanel" hidden>
        <div id="horarios-list" class="hours-list"></div>
      </div>

      <!-- TAB: AVISO -->
      <div id="tab-aviso" class="tab-panel" role="tabpanel" hidden>
        <div class="aviso-panel">
          <label class="toggle-row">
            <span class="toggle-row__label">Mostrar aviso en la web</span>
            <div class="toggle-wrap">
              <input type="checkbox" id="aviso-active" class="toggle-input" role="switch">
              <span class="toggle-thumb" aria-hidden="true"></span>
            </div>
          </label>
          <div class="field-group">
            <label class="field-label" for="aviso-texto-es">Texto del aviso (español)</label>
            <textarea
              id="aviso-texto-es"
              class="field-textarea"
              placeholder="Ej: Cerrado por vacaciones del 1 al 15 de agosto."
              rows="3"
            ></textarea>
          </div>
          <div class="field-group">
            <label class="field-label" for="aviso-texto-en">Texto del aviso (inglés)</label>
            <textarea
              id="aviso-texto-en"
              class="field-textarea"
              placeholder="E.g.: Closed for holidays August 1–15."
              rows="3"
            ></textarea>
          </div>
          <div class="field-group">
            <label class="field-label" for="aviso-texto-fr">Texto del aviso (francés)</label>
            <textarea
              id="aviso-texto-fr"
              class="field-textarea"
              placeholder="Ex.: Fermé pour vacances du 1er au 15 août."
              rows="3"
            ></textarea>
          </div>
          <div class="field-group">
            <label class="field-label" for="aviso-expiry">Fecha de caducidad del aviso (opcional)</label>
            <input
              type="date"
              id="aviso-expiry"
              class="field-input"
            >
            <span class="field-hint">Después de esta fecha el aviso se ocultará automáticamente.</span>
          </div>
        </div>
      </div>

      <!-- TAB: CARIOCA -->
      <div id="tab-carioca" class="tab-panel" role="tabpanel" hidden>
        <div class="carioca-panel">
          <div class="field-group">
            <label class="field-label">Imagen (JPG, WebP o PNG — máx. 10 MB)</label>
            <label class="upload-area" id="upload-area" for="carioca-file">
              <span class="upload-icon" aria-hidden="true">📷</span>
              <span class="upload-text">Toca para elegir una foto</span>
              <input
                type="file"
                id="carioca-file"
                class="upload-input"
                accept="image/jpeg,image/jpg,image/webp,image/png"
                aria-label="Elegir imagen"
              >
            </label>
          </div>
          <div id="carioca-preview-wrap" class="carioca-preview-wrap" hidden>
            <img id="carioca-preview" class="carioca-preview" alt="Vista previa">
            <button class="carioca-remove" id="carioca-remove" aria-label="Quitar imagen">✕</button>
          </div>
          <div class="field-group">
            <label class="field-label" for="carioca-caption-es">Descripción (español)</label>
            <input type="text" id="carioca-caption-es" class="field-input" placeholder="Ej: Tertulia en Bar León, 1972.">
          </div>
          <div class="field-group">
            <label class="field-label" for="carioca-caption-en">Descripción (inglés)</label>
            <input type="text" id="carioca-caption-en" class="field-input" placeholder="E.g.: A gathering at Bar León, 1972.">
          </div>
          <div class="field-group">
            <label class="field-label" for="carioca-caption-fr">Descripción (francés)</label>
            <input type="text" id="carioca-caption-fr" class="field-input" placeholder="Ex.: Une réunion au Bar León, 1972.">
          </div>
          <div class="field-group">
            <label class="field-label" for="carioca-context">Sección de la web</label>
            <select id="carioca-context" class="field-select">
              <option value="homepage">Portada</option>
              <option value="historia">Historia</option>
              <option value="hemeroteca">Hemeroteca</option>
            </select>
          </div>
          <label class="toggle-row">
            <span class="toggle-row__label">Imagen activa (visible en la web)</span>
            <div class="toggle-wrap">
              <input type="checkbox" id="carioca-active" class="toggle-input" role="switch" checked>
              <span class="toggle-thumb" aria-hidden="true"></span>
            </div>
          </label>
          <p id="carioca-upload-status" class="carioca-status" hidden></p>
        </div>
      </div>

    </main>

    <!-- Barra de guardar -->
    <div class="panel-save-bar">
      <span id="save-status" class="save-status"></span>
      <button id="save-btn" class="btn btn--primary btn--save">Guardar cambios</button>
    </div>

  </div><!-- /#panel -->

  <!-- Toast de error -->
  <div id="error-toast" class="error-toast" role="alert" aria-live="assertive" hidden></div>

  <script src="/panel/app.js"></script>
</body>
</html>
