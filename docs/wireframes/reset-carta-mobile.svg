<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1200" font-family="Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #EDEDED; stroke: #999; stroke-width: 1; }
    .bar { fill: #CFCFCF; stroke: #888; stroke-width: 1; }
    .chip { fill: #E4E4E4; stroke: #888; stroke-width: 1; }
    .lbl { fill: #444; font-size: 12px; }
    .sm  { fill: #777; font-size: 9px; }
    .pct { fill: #999; font-size: 9px; text-anchor: end; }
    .name { fill: #333; font-size: 12px; font-weight: bold; }
    .price { fill: #555; font-size: 10px; font-weight: bold; text-anchor: end; }
  </style>
  <rect width="390" height="1200" fill="#FFFFFF" stroke="#666"/>
  <text x="12" y="20" class="lbl">CARTA · MOBILE 390 — hierarchy/proportions only</text>

  <!-- Header: one line at 320px -->
  <rect x="0" y="28" width="390" height="48" class="bar"/>
  <text x="10" y="58" class="sm">← Bar León</text>
  <text x="175" y="58" class="lbl">CARTA</text>
  <text x="330" y="58" class="sm">ES EN FR</text>
  <text x="382" y="44" class="pct">4%</text>

  <!-- Sticky category chips -->
  <rect x="0" y="76" width="390" height="56" class="box"/>
  <rect x="12" y="86" width="120" height="36" class="bar"/>
  <rect x="140" y="86" width="96" height="36" class="chip"/>
  <rect x="244" y="86" width="96" height="36" class="chip"/>
  <rect x="348" y="86" width="60" height="36" class="chip"/>
  <text x="26" y="109" class="sm">ACTIVE (solid)</text>
  <text x="156" y="109" class="sm">Category</text>
  <text x="260" y="109" class="sm">Category</text>
  <text x="360" y="109" class="sm">…scrolls →</text>
  <text x="382" y="92" class="pct">5% sticky</text>

  <!-- Category head -->
  <text x="12" y="168" class="lbl" font-size="15">H2 CATEGORY (display)</text>
  <text x="382" y="168" class="pct">rows 44px+</text>

  <!-- Dish rows -->
  <g>
    <line x1="12" y1="184" x2="378" y2="184" stroke="#CCC"/>
    <text x="12" y="206" class="name">Dish name (serif bold 1.15)</text>
    <text x="12" y="222" class="sm">short description, max two lines, muted</text>
    <text x="378" y="242" class="price">10,00 €</text>
  </g>
  <g>
    <line x1="12" y1="256" x2="378" y2="256" stroke="#CCC"/>
    <text x="12" y="278" class="name">Dish name  ⬤ recomendado mark</text>
    <text x="12" y="294" class="sm">short description</text>
    <text x="378" y="314" class="price">Media 7,50 € · Ración 10,00 €</text>
  </g>
  <g>
    <line x1="12" y1="328" x2="378" y2="328" stroke="#CCC"/>
    <text x="12" y="350" class="name">Dish name</text>
    <text x="12" y="366" class="sm">short description</text>
    <text x="378" y="386" class="price">13,00 €</text>
  </g>
  <g>
    <line x1="12" y1="400" x2="378" y2="400" stroke="#CCC"/>
    <text x="12" y="422" class="name">Dish name</text>
    <text x="12" y="438" class="sm">description</text>
    <text x="378" y="458" class="price">9,00 €</text>
  </g>

  <!-- Next category -->
  <text x="12" y="520" class="lbl" font-size="15">H2 NEXT CATEGORY</text>
  <g>
    <line x1="12" y1="536" x2="378" y2="536" stroke="#CCC"/>
    <text x="12" y="558" class="name">Dish name</text>
    <text x="12" y="574" class="sm">description</text>
    <text x="378" y="594" class="price">5,00 €</text>
  </g>
  <g>
    <line x1="12" y1="608" x2="378" y2="608" stroke="#CCC"/>
    <text x="12" y="630" class="name">Dish name</text>
    <text x="12" y="646" class="sm">description</text>
    <text x="378" y="666" class="price">6,50 €</text>
  </g>
  <g>
    <line x1="12" y1="680" x2="378" y2="680" stroke="#CCC"/>
    <text x="12" y="702" class="name">Dish name</text>
    <text x="12" y="718" class="sm">description</text>
    <text x="378" y="738" class="price">7,00 €</text>
  </g>

  <!-- pattern continues indicator -->
  <text x="150" y="800" class="sm">… categories continue (same row pattern) …</text>

  <!-- Horario block -->
  <text x="12" y="860" class="lbl" font-size="15">H2 HORARIO</text>
  <rect x="12" y="874" width="366" height="160" class="box"/>
  <text x="24" y="898" class="sm">Lunes      13:00–16:00 / 20:00–23:00</text>
  <text x="24" y="918" class="sm">Martes     13:00–16:00 · solo mediodía</text>
  <text x="24" y="938" class="sm">Miércoles  cerrado</text>
  <text x="24" y="958" class="sm">Jueves–Domingo …</text>
  <text x="24" y="994" class="sm">Teléfono: +34 958 22 51 43</text>

  <!-- Footer -->
  <rect x="0" y="1060" width="390" height="26" class="bar"/>
  <text x="12" y="1077" class="sm">footer: address · phone</text>

  <!-- Sticky actions -->
  <rect x="0" y="1132" width="390" height="68" class="bar"/>
  <line x1="130" y1="1132" x2="130" y2="1200" stroke="#999"/>
  <line x1="260" y1="1132" x2="260" y2="1200" stroke="#999"/>
  <text x="40" y="1170" class="lbl">Llamar</text>
  <text x="168" y="1170" class="lbl">Horario</text>
  <text x="300" y="1170" class="lbl">Arriba</text>
  <text x="382" y="1148" class="pct">sticky 54px + safe-area</text>
</svg>
