<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Bar León — Admin</title>
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    // ── ESTILOS DEL PANEL DE PREVISUALIZACIÓN ──────────────────
    CMS.registerPreviewStyle('/css/style.css');
    CMS.registerPreviewStyle([
      'body { font-family: Georgia, serif; background: #F6F3EC; color: #1C1A17; padding: 24px 20px; max-width: 540px; margin: 0 auto; }',
      '.pr-aviso { background: #7A1C1C; color: #F6F3EC; padding: 10px 16px; font-size: 0.85rem; margin-bottom: 20px; letter-spacing: 0.03em; }',
      '.pr-section { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.14em; color: #5C5752; border-top: 1px solid rgba(28,26,23,0.15); padding-top: 12px; margin: 20px 0 8px; }',
      '.pr-menu { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; }',
      '.pr-menu-precio { font-family: "Courier New", monospace; color: #7A1C1C; font-size: 0.95rem; }',
      '.pr-tag { display: inline-block; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.08em; padding: 2px 7px; border-radius: 2px; vertical-align: middle; }',
      '.pr-tag.activo { background: #d4edda; color: #155724; }',
      '.pr-tag.oculto { background: #f8d7da; color: #721c24; }',
      '.pr-plato { padding: 10px 0; border-bottom: 1px solid rgba(28,26,23,0.1); }',
      '.pr-plato-nombre { font-size: 0.95rem; font-weight: bold; margin: 0 0 2px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }',
      '.pr-plato-precio { font-family: "Courier New", monospace; font-size: 0.85rem; color: #7A1C1C; margin: 2px 0; }',
      '.pr-plato-desc { font-size: 0.8rem; color: #5C5752; margin: 4px 0 2px; }',
      '.pr-plato-maridaje { font-size: 0.75rem; color: #7A1C1C; margin: 0; }',
      '.pr-horario { display: flex; justify-content: space-between; font-size: 0.8rem; padding: 4px 0; border-bottom: 1px solid rgba(28,26,23,0.08); }',
      '.pr-cerrado { color: #5C5752; font-style: italic; }',
    ].join('\n'), { raw: true });

    // ── COMPONENTE DE PREVISUALIZACIÓN ─────────────────────────
    var h = CMS.h;

    function tag(text, tipo) {
      return h('span', { className: 'pr-tag ' + tipo }, text);
    }

    function seccion(titulo) {
      return h('p', { className: 'pr-section' }, titulo);
    }

    function PreviewBarLeon(props) {
      var entry   = props.entry;
      var data    = entry.getIn(['data']);
      if (!data) return h('div', {}, 'Cargando...');

      var inicio  = data.get('inicio') || CMS.Immutable.Map();
      var menu    = data.get('menuDia') || CMS.Immutable.Map();
      var horarios = data.get('horarios') || CMS.Immutable.List();
      var carta   = data.get('carta') || CMS.Immutable.List();

      var aviso   = inicio.get ? inicio.get('avisoEspecial') : '';
      var menuOn  = menu.get ? menu.get('disponible') === 'SI' : false;
      var precio  = menu.get ? menu.get('precio') : '';
      var dias    = menu.get ? menu.get('dias') : '';

      // Carta: separar disponibles de ocultos
      var cartaArr = carta.toJS ? carta.toJS() : [];
      var activos  = cartaArr.filter(function(p) { return p.disponible === 'SI'; });
      var ocultos  = cartaArr.filter(function(p) { return p.disponible !== 'SI'; });

      // Agrupar activos por categoría
      var grupos = {};
      activos.forEach(function(p) {
        var cat = p.categoria || 'Sin categoría';
        if (!grupos[cat]) grupos[cat] = [];
        grupos[cat].push(p);
      });

      return h('div', {},
        // Aviso
        aviso ? h('div', { className: 'pr-aviso' }, '⚠️ ' + aviso) : null,

        // Menú del día
        seccion('Menú del día'),
        h('div', { className: 'pr-menu' },
          h('span', {}, menuOn ? (dias || '') : 'No disponible hoy'),
          menuOn ? h('span', { className: 'pr-menu-precio' }, precio) : tag('Oculto', 'oculto')
        ),

        // Carta activa por sección
        seccion('Carta — ' + activos.length + ' platos visibles'),
        Object.keys(grupos).map(function(cat) {
          return h('div', { key: cat },
            h('p', { style: { fontSize: '0.7rem', textTransform: 'uppercase', letterSpacing: '0.1em', color: '#7A1C1C', margin: '14px 0 4px' } }, cat),
            grupos[cat].map(function(p, i) {
              return h('div', { key: i, className: 'pr-plato' },
                h('p', { className: 'pr-plato-nombre' },
                  p.nombre,
                  tag('Visible', 'activo')
                ),
                h('p', { className: 'pr-plato-precio' }, p.precio),
                p.descripcion ? h('p', { className: 'pr-plato-desc' }, p.descripcion) : null,
                p.maridaje    ? h('p', { className: 'pr-plato-maridaje' }, p.maridaje) : null
              );
            })
          );
        }),

        // Platos ocultos
        ocultos.length > 0
          ? h('div', {},
              seccion('Platos ocultos (' + ocultos.length + ')'),
              ocultos.map(function(p, i) {
                return h('div', { key: i, className: 'pr-plato' },
                  h('p', { className: 'pr-plato-nombre' },
                    p.nombre,
                    tag('Oculto', 'oculto')
                  ),
                  h('p', { className: 'pr-plato-precio' }, p.precio)
                );
              })
            )
          : null,

        // Horarios
        seccion('Horarios'),
        horarios.toJS ? horarios.toJS().map(function(d, i) {
          var cerrado = d.estado === 'CERRADO';
          return h('div', { key: i, className: 'pr-horario' },
            h('span', {}, d.dia),
            h('span', { className: cerrado ? 'pr-cerrado' : '' }, d.detalle || d.estado)
          );
        }) : null
      );
    }

    CMS.registerPreviewTemplate('data_es', PreviewBarLeon);
  </script>
</body>
</html>
