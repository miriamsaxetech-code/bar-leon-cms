backend:
  name: github
  repo: miriamsaxetech-code/bar-leon-cms
  branch: main
  base_url: https://restaurantebarleon.com
  auth_endpoint: auth
  site_domain: restaurantebarleon.com

media_folder: assets/images
public_folder: assets/images

collections:
  - name: bar_leon
    label: Bar León
    files:

      - name: venue
        label: Carta, Menú y Horarios
        file: data/venue.json
        format: json
        fields:

          # ── SCHEMA VERSION — HIDDEN ─────────────────────────────
          - name: _schema
            widget: hidden
            default: "nexo-horeca-universal-venue-v1"

          # ── MENÚ DEL DÍA ────────────────────────────────────────
          - name: daily_menu
            label: "🍽️ Menú del día"
            widget: object
            collapsed: false
            fields:
              - name: active
                label: ¿Mostrar menú del día en la web?
                widget: boolean
                default: true
              - name: price
                label: Precio del menú
                widget: number
                value_type: float
              - name: days
                label: Días de servicio (internal values)
                widget: list
                default: ["monday", "tuesday", "thursday", "friday"]
              - name: service_period
                label: Horario de servicio
                widget: object
                fields:
                  - { name: open, label: "Apertura", widget: string }
                  - { name: close, label: "Cierre", widget: string }
              - name: starters
                label: Primeros (opciones del día)
                widget: object
                fields:
                  - { name: es, label: "Primeros (ES)", widget: string }
                  - { name: en, label: "Primeros (EN)", widget: string, required: false }
                  - { name: fr, label: "Primeros (FR)", widget: string, required: false }
              - name: seconds
                label: Segundos (opciones del día)
                widget: object
                fields:
                  - { name: es, label: "Segundos (ES)", widget: string }
                  - { name: en, label: "Segundos (EN)", widget: string, required: false }
                  - { name: fr, label: "Segundos (FR)", widget: string, required: false }
              - name: mains
                label: Plato especial por día
                label_singular: Día
                widget: list
                summary: "{{fields.day}}: {{fields.name.es}}"
                fields:
                  - name: day
                    label: Día
                    widget: select
                    options:
                      - { label: "Lunes",   value: "monday" }
                      - { label: "Martes",  value: "tuesday" }
                      - { label: "Jueves",  value: "thursday" }
                      - { label: "Viernes", value: "friday" }
                  - name: name
                    label: Nombre del plato
                    widget: object
                    fields:
                      - { name: es, label: "Plato (ES)", widget: string }
                      - { name: en, label: "Plato (EN)", widget: string, required: false }
                      - { name: fr, label: "Plato (FR)", widget: string, required: false }
              - name: desserts
                label: Postre (opciones)
                widget: object
                fields:
                  - { name: es, label: "Postre (ES)", widget: string }
                  - { name: en, label: "Postre (EN)", widget: string, required: false }
                  - { name: fr, label: "Postre (FR)", widget: string, required: false }
              - name: includes
                label: Condiciones del menú
                widget: object
                collapsed: true
                fields:
                  - { name: es, label: "Incluye (ES)", widget: text }
                  - { name: en, label: "Includes (EN)", widget: text, required: false }
                  - { name: fr, label: "Inclus (FR)", widget: text, required: false }
              - name: seasonal
                label: Nota de temporada (opcional)
                widget: object
                collapsed: true
                fields:
                  - { name: es, label: "Nota (ES)", widget: string, required: false }
                  - { name: en, label: "Nota (EN)", widget: string, required: false }
                  - { name: fr, label: "Nota (FR)", widget: string, required: false }

          # ── CARTA PLATOS ────────────────────────────────────────
          - name: dishes
            label: "📋 Carta (platos)"
            label_singular: Plato
            widget: list
            summary: "{{fields.name.es}} · {{fields.price}}"
            collapsed: true
            fields:
              - { name: available, label: "¿En carta hoy?", widget: boolean, default: true }
              - label: "Estado"
                name: "status"
                widget: "select"
                required: false
                default: "available"
                options:
                  - { label: "Disponible", value: "available" }
                  - { label: "Agotado hoy", value: "soldout" }
                  - { label: "Solo de temporada", value: "seasonal" }
              - name: name
                label: Nombre del plato
                widget: object
                fields:
                  - { name: es, label: "Nombre (ES)", widget: string }
                  - { name: en, label: "Nombre (EN)", widget: string, required: false }
                  - { name: fr, label: "Nombre (FR)", widget: string, required: false }
              - { name: price, label: "Precio", widget: string }
              - name: category_id
                label: Sección de la carta
                widget: select
                options:
                  - { label: "Sabores de Andalucía",      value: "andalusian-specialities" }
                  - { label: "Sopas y platos de cuchara", value: "soups-stews" }
                  - { label: "Entrantes y raciones",       value: "starters" }
                  - { label: "Frituras y pescados",         value: "fried-fish" }
                  - { label: "Carnes",                      value: "meats" }
                  - { label: "Huevos y tortillas",          value: "eggs-omelettes" }
                  - { label: "Arroces",                     value: "rice" }
                  - { label: "Postres",                     value: "desserts" }
                  - { label: "Bocadillos",                  value: "bocadillos" }
              - name: description
                label: Descripción
                widget: object
                collapsed: true
                fields:
                  - { name: es, label: "Descripción (ES)", widget: text }
                  - { name: en, label: "Descripción (EN)", widget: text, required: false }
                  - { name: fr, label: "Descripción (FR)", widget: text, required: false }
              - name: pairing
                label: Maridaje (opcional)
                widget: object
                collapsed: true
                fields:
                  - { name: es, label: "Sugerencia (ES)", widget: string, required: false }
                  - { name: en, label: "Sugerencia (EN)", widget: string, required: false }
                  - { name: fr, label: "Sugerencia (FR)", widget: string, required: false }
              - { name: id, label: "ID interno", widget: string }
              - label: "Destacado"
                name: "featured"
                widget: "select"
                required: false
                options:
                  - { label: "⭐ Recomendado", value: "recommended" }
                  - { label: "🌿 Temporada", value: "seasonal" }
                  - { label: "🦁 De la casa", value: "house" }

          # ── CARTA VINOS ─────────────────────────────────────────
          - name: wines
            label: "🍷 Carta de Vinos"
            widget: list
            collapsed: true
            summary: "{{fields.name}} · {{fields.price_bottle}}€"
            fields:
              - { name: available, label: "¿Disponible?", widget: boolean, default: true }
              - { name: id, label: "ID interno", widget: string }
              - { name: category_id, label: "Categoría", widget: select, options: ["granada-wines", "rioja", "ribera-del-duero", "valdepenas", "whites-fortified"] }
              - { name: name, label: "Nombre del vino", widget: string }
              - { name: producer, label: "Productor / Bodega (opcional)", widget: string, required: false }
              - { name: region, label: "Región / Denominación", widget: string }
              - { name: type, label: "Tipo", widget: select, options: ["red", "white", "rose", "sherry"] }
              - { name: price_bottle, label: "Precio por botella", widget: number, value_type: float, required: false }
              - { name: price_glass, label: "Precio por copa (opcional)", widget: number, value_type: float, required: false }

          # ── CERVEZAS Y BEBIDAS ──────────────────────────────────
          - name: beverages
            label: "🍺 Cervezas y Refrescos"
            widget: list
            collapsed: true
            summary: "{{fields.name.es}} · {{fields.price}}"
            fields:
              - { name: available, label: "¿Disponible?", widget: boolean, default: true }
              - { name: id, label: "ID interno", widget: string }
              - { name: category_id, label: "Categoría", widget: select, options: ["beer", "drinks", "soft-drinks"] }
              - name: name
                label: "Nombre"
                widget: object
                fields:
                  - { name: es, label: "Nombre (ES)", widget: string }
                  - { name: en, label: "Nombre (EN)", widget: string, required: false }
                  - { name: fr, label: "Nombre (FR)", widget: string, required: false }
              - { name: price, label: "Precio", widget: string }

          # ── HORARIOS ────────────────────────────────────────────
          - name: hours
            label: "🕐 Horarios"
            label_singular: Día
            widget: list
            summary: "{{fields.day}} — {{fields.status}}"
            collapsed: false
            fields:
              - name: day
                label: Día
                widget: select
                options:
                  - { label: "Lunes",     value: "monday" }
                  - { label: "Martes",    value: "tuesday" }
                  - { label: "Miércoles", value: "wednesday" }
                  - { label: "Jueves",    value: "thursday" }
                  - { label: "Viernes",   value: "friday" }
                  - { label: "Sábado",    value: "saturday" }
                  - { label: "Domingo",   value: "sunday" }
              - name: status
                label: Estado
                widget: select
                options:
                  - { label: "Abierto (comida y cena)", value: "open" }
                  - { label: "Solo mediodía",            value: "partial" }
                  - { label: "Cerrado",                  value: "closed" }
              - name: periods
                label: Franjas horarias
                label_singular: Franja
                widget: list
                required: false
                summary: "{{fields.open}} – {{fields.close}}"
                fields:
                  - { name: open, label: "Apertura", widget: string }
                  - { name: close, label: "Cierre", widget: string }
              - name: note
                label: Nota específica
                widget: object
                collapsed: true
                fields:
                  - { name: es, label: "Nota (ES)", widget: string, required: false }
                  - { name: en, label: "Nota (EN)", widget: string, required: false }
                  - { name: fr, label: "Nota (FR)", widget: string, required: false }

          # ── INFORMACIÓN DEL LOCAL ───────────────────────────────
          - name: venue
            label: "🏢 Información del local"
            widget: object
            collapsed: true
            fields:
              - name: slug
                label: "Slug"
                widget: string
                default: "bar-leon"
              - name: name
                label: "Nombre del local"
                widget: object
                fields:
                  - { name: es, label: "Nombre (ES)", widget: string }
                  - { name: en, label: "Nombre (EN)", widget: string }
                  - { name: fr, label: "Nombre (FR)", widget: string }
              - name: full_name
                label: "Nombre completo"
                widget: object
                fields:
                  - { name: es, label: "Nombre completo (ES)", widget: string }
                  - { name: en, label: "Nombre completo (EN)", widget: string }
                  - { name: fr, label: "Nombre completo (FR)", widget: string }
              - name: tagline
                label: "Lema / Subtítulo"
                widget: object
                fields:
                  - { name: es, label: "Lema (ES)", widget: string }
                  - { name: en, label: "Lema (EN)", widget: string }
                  - { name: fr, label: "Lema (FR)", widget: string }
              - name: founding_year
                label: "Año de fundación"
                widget: number
                value_type: int
              - name: cuisine
                label: "Cocina"
                widget: object
                fields:
                  - { name: es, label: "Cocina (ES)", widget: string }
                  - { name: en, label: "Cocina (EN)", widget: string }
                  - { name: fr, label: "Cocina (FR)", widget: string }
              - name: cuisine_tag
                label: "Etiqueta de cocina"
                widget: object
                fields:
                  - { name: es, label: "Etiqueta (ES)", widget: string }
                  - { name: en, label: "Etiqueta (EN)", widget: string }
                  - { name: fr, label: "Etiqueta (FR)", widget: string }
              - name: notice
                label: "⚠️ Aviso especial"
                widget: object
                collapsed: true
                fields:
                  - { name: es, label: "Aviso (ES)", widget: string, required: false }
                  - { name: en, label: "Aviso (EN)", widget: string, required: false }
                  - { name: fr, label: "Aviso (FR)", widget: string, required: false }
              - name: notice_active
                label: "Mostrar aviso en la web"
                widget: boolean
                required: false
                default: false
              - name: notice_expiry
                label: "Fecha de caducidad del aviso"
                widget: string
                required: false
              - name: currency
                label: "Moneda"
                widget: string
                default: "EUR"
              - name: primary_language
                label: "Idioma principal"
                widget: string
                default: "es"
              - name: active_languages
                label: "Idiomas activos"
                widget: list
                default: ["es", "en", "fr"]
              - label: "Modo de servicio"
                name: "service_mode"
                widget: "object"
                required: false
                fields:
                  - { label: "Menú del día activo", name: "menu_del_dia", widget: "boolean", default: true }
                  - { label: "Restaurante abierto", name: "restaurant_open", widget: "boolean", default: true }
                  - { label: "Barra abierta", name: "bar_open", widget: "boolean", default: true }

          # ── CONTACTO ────────────────────────────────────────────
          - name: contact
            label: "📞 Contacto"
            widget: object
            collapsed: true
            fields:
              - name: address
                label: "Dirección física"
                widget: object
                fields:
                  - { name: street, label: "Calle y número", widget: string }
                  - { name: neighborhood, label: "Barrio (ej: Albayzín)", widget: string }
                  - { name: postal_code, label: "Código postal", widget: string }
                  - { name: city, label: "Ciudad", widget: string }
                  - { name: region, label: "Región (ej: Andalucía)", widget: string }
                  - { name: country, label: "País (código)", widget: string }
              - { name: phone, label: "Teléfono", widget: string }
              - { name: phone_link, label: "Enlace telefónico (tel:)", widget: string }
              - { name: email, label: "Email (opcional)", widget: string, required: false }
              - { name: whatsapp, label: "WhatsApp", widget: string }

          # ── REDES SOCIALES ──────────────────────────────────────
          - name: social
            label: "🌐 Redes Sociales y Enlaces"
            widget: object
            collapsed: true
            fields:
              - { name: instagram, label: "Instagram", widget: string, required: false }
              - { name: facebook, label: "Facebook", widget: string, required: false }
              - { name: tripadvisor, label: "TripAdvisor", widget: string, required: false }
              - { name: google_maps, label: "Google Maps Link", widget: string }
              - { name: google_reviews, label: "Google Reviews Link", widget: string }
              - { name: x, label: "Twitter / X", widget: string, required: false }

          # ── SEO ─────────────────────────────────────────────────
          - name: seo
            label: "🔍 SEO y Metadatos"
            widget: object
            collapsed: true
            fields:
              - name: title
                label: "Título de la web"
                widget: object
                fields:
                  - { name: es, label: "Título (ES)", widget: string }
                  - { name: en, label: "Título (EN)", widget: string }
                  - { name: fr, label: "Título (FR)", widget: string }
              - name: description
                label: "Descripción de la web"
                widget: object
                fields:
                  - { name: es, label: "Descripción (ES)", widget: text }
                  - { name: en, label: "Descripción (EN)", widget: text, required: false }
                  - { name: fr, label: "Descripción (FR)", widget: text, required: false }
              - name: keywords
                label: "Palabras clave"
                widget: object
                fields:
                  - { name: es, label: "Keywords (ES)", widget: list }
                  - { name: en, label: "Keywords (EN)", widget: list }
                  - { name: fr, label: "Keywords (FR)", widget: list }
              - { name: canonical, label: "URL Canónica", widget: string }
              - { name: og_image, label: "Imagen OpenGraph (Redes)", widget: image }

          # ── HERO ────────────────────────────────────────────────
          - name: hero
            label: "🖼️ Imagen de cabecera (Hero)"
            widget: object
            collapsed: true
            fields:
              - { name: image, label: "Imagen", widget: image }
              - name: alt
                label: "Texto alternativo (alt)"
                widget: object
                fields:
                  - { name: es, label: "Alt (ES)", widget: string }
                  - { name: en, label: "Alt (EN)", widget: string }
                  - { name: fr, label: "Alt (FR)", widget: string }
              - { name: focal_point, label: "Foco de imagen", widget: string, default: "center" }

          # ── CATEGORÍAS CARTA ────────────────────────────────────
          - name: categories
            label: "📁 Categorías de la carta"
            widget: list
            collapsed: true
            summary: "{{fields.id}} ({{fields.type}})"
            fields:
              - { name: id, label: "ID de la categoría", widget: string }
              - name: name
                label: "Nombre visible"
                widget: object
                fields:
                  - { name: es, label: "Nombre (ES)", widget: string }
                  - { name: en, label: "Nombre (EN)", widget: string }
                  - { name: fr, label: "Nombre (FR)", widget: string }
              - { name: type, label: "Tipo (food / wine / drink)", widget: select, options: ["food", "wine", "drink"] }
              - { name: service, label: "Servicio (restaurant / bar)", widget: select, options: ["restaurant", "bar"], required: false }
              - { name: order, label: "Orden", widget: number, value_type: int }

          # ── Textos de Navegación ───────────────────────────────────
          - name: nav
            label: "⚓ Textos de Navegación y Botones"
            widget: object
            collapsed: true
            fields:
              - name: menu
                label: "Carta"
                widget: object
                fields:
                  - { name: es, label: "ES", widget: string }
                  - { name: en, label: "EN", widget: string }
                  - { name: fr, label: "FR", widget: string }
              - name: hours
                label: "Horarios"
                widget: object
                fields:
                  - { name: es, label: "ES", widget: string }
                  - { name: en, label: "EN", widget: string }
                  - { name: fr, label: "FR", widget: string }
              - name: call
                label: "Llamar"
                widget: object
                fields:
                  - { name: es, label: "ES", widget: string }
                  - { name: en, label: "EN", widget: string }
                  - { name: fr, label: "FR", widget: string }
              - name: back
                label: "Volver (ej: ← Bar León)"
                widget: object
                fields:
                  - { name: es, label: "ES", widget: string }
                  - { name: en, label: "EN", widget: string }
                  - { name: fr, label: "FR", widget: string }
              - name: daily_menu
                label: "Menú del día"
                widget: object
                fields:
                  - { name: es, label: "ES", widget: string }
                  - { name: en, label: "EN", widget: string }
                  - { name: fr, label: "FR", widget: string }
              - name: edict_header
                label: "Cabecera edicto menú"
                widget: object
                fields:
                  - { name: es, label: "ES", widget: string }
                  - { name: en, label: "EN", widget: string }
                  - { name: fr, label: "FR", widget: string }
              - name: edict_foot
                label: "Pie de página edicto menú"
                widget: object
                fields:
                  - { name: es, label: "ES", widget: string }
                  - { name: en, label: "EN", widget: string }
                  - { name: fr, label: "FR", widget: string }
              - name: whatsapp_btn
                label: "Botón reservar WhatsApp"
                widget: object
                fields:
                  - { name: es, label: "ES", widget: string }
                  - { name: en, label: "EN", widget: string }
                  - { name: fr, label: "FR", widget: string }
              - name: tab_daily
                label: "Pestaña Menú del Día"
                widget: object
                fields:
                  - { name: es, label: "ES", widget: string }
                  - { name: en, label: "EN", widget: string }
                  - { name: fr, label: "FR", widget: string }
              - name: tab_restaurant
                label: "Pestaña Carta Restaurante"
                widget: object
                fields:
                  - { name: es, label: "ES", widget: string }
                  - { name: en, label: "EN", widget: string }
                  - { name: fr, label: "FR", widget: string }
              - name: tab_bar
                label: "Pestaña Carta Barra"
                widget: object
                fields:
                  - { name: es, label: "ES", widget: string }
                  - { name: en, label: "EN", widget: string }
                  - { name: fr, label: "FR", widget: string }

          # ── PIZARRA DE LA BARRA ─────────────────────────────────
          - name: chalkboard
            label: "🍖 Pizarra de la Barra"
            widget: object
            collapsed: true
            fields:
              - name: group1
                label: "Columna izquierda (carnes, embutidos)"
                label_singular: Plato
                widget: list
                summary: "{{fields.es}}"
                fields:
                  - { name: es, label: "Nombre (ES)", widget: string }
                  - { name: en, label: "Nombre (EN)", widget: string, required: false }
                  - { name: fr, label: "Nombre (FR)", widget: string, required: false }
                  - { name: media, label: "Precio media (ej: 10,00)", widget: string, required: false }
                  - { name: racion, label: "Precio ración (ej: 14,00)", widget: string }
              - name: group2
                label: "Columna derecha (fritos, verduras, pescados)"
                label_singular: Plato
                widget: list
                summary: "{{fields.es}}"
                fields:
                  - { name: es, label: "Nombre (ES)", widget: string }
                  - { name: en, label: "Nombre (EN)", widget: string, required: false }
                  - { name: fr, label: "Nombre (FR)", widget: string, required: false }
                  - { name: media, label: "Precio media (ej: 8,50)", widget: string, required: false }
                  - { name: racion, label: "Precio ración (ej: 11,50)", widget: string }

          # ── CARIOCAS ────────────────────────────────────────────
          - name: cariocas
            label: "🎭 Cariocas"
            label_singular: Carioca
            widget: list
            collapsed: true
            summary: "{{fields.id}}"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - label: "Imagen"
                name: "image"
                widget: "image"
                media_folder: "/assets/images/cariocas"
              - label: "Texto (ES)"
                name: "caption"
                widget: "object"
                fields:
                  - { label: "Español", name: "es", widget: "string" }
                  - { label: "English", name: "en", widget: "string", required: false }
                  - { label: "Français", name: "fr", widget: "string", required: false }
              - { label: "Activa", name: "active", widget: "boolean", default: false }
              - label: "Contexto"
                name: "context"
                widget: "select"
                default: "homepage"
                options:
                  - { label: "Inicio (homepage)", value: "homepage" }
                  - { label: "Historia", value: "historia" }
                  - { label: "Stories of León", value: "archive" }
