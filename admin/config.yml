backend:
  name: github
  client_id: Ov23lieTq9aZEP0a4XDD
  repo: miriamsaxetech-code/bar-leon-cms
  branch: main

media_folder: assets/images
public_folder: assets/images

collections:
  - name: bar_leon
    label: Bar León
    files:

      - name: data_es
        label: Carta, Menú y Horarios (Español)
        file: data/es.json
        format: json
        fields:

          # ── INICIO ─────────────────────────────────────────────
          - name: inicio
            label: Página de Inicio
            widget: object
            fields:
              - name: titular
                label: Frase principal
                widget: string
                hint: "Una línea. Ej: Tres generaciones sin cambiar de receta."

              - name: subtitulo
                label: Subtítulo institucional
                widget: string
                hint: "No modificar salvo cambio de ubicación. Ej: Plaza Nueva · Granada"

              - name: avisoEspecial
                label: Aviso especial (opcional)
                widget: string
                required: false
                hint: "Dejar en blanco si no hay aviso activo."

          # ── MENÚ DEL DÍA ────────────────────────────────────────
          - name: menuDia
            label: Menú del Día
            widget: object
            fields:
              - name: disponible
                label: ¿Disponible hoy?
                widget: select
                options:
                  - label: "Sí — mostrar en web"
                    value: "SI"
                  - label: "No — ocultar en web"
                    value: "NO"
                default: "SI"

              - name: dias
                label: Días de servicio
                widget: string
                hint: "Ej: Lunes, Martes, Jueves y Viernes (Solo Mediodía)"

              - name: precio
                label: Precio
                widget: string
                hint: "Ej: 12,50€"

              - name: condiciones
                label: Condiciones
                widget: text
                hint: "Qué incluye el menú."

              - name: primeros
                label: Primeros (opciones)
                widget: string
                hint: "Ej: Gazpacho · Sopa de picadillo · Ensalada"

              - name: platosDelDia
                label: Platos del día (por día)
                label_singular: Día
                widget: list
                fields:
                  - name: dia
                    label: Día
                    widget: string
                    hint: "Ej: Lunes"
                  - name: plato
                    label: Plato
                    widget: string
                    hint: "Ej: Cocido"

              - name: temporada
                label: Especiales de temporada (opcional)
                widget: string
                required: false
                hint: "Ej: En verano: Arroz a la cubana. Viernes Santo: Potaje de vigilia."

          # ── HORARIOS ────────────────────────────────────────────
          - name: horarios
            label: Horarios
            label_singular: Día
            widget: list
            fields:
              - name: dia
                label: Día
                widget: string

              - name: estado
                label: Estado
                widget: select
                options:
                  - ABIERTO
                  - CERRADO
                  - CERRADO TARDE

              - name: detalle
                label: Texto visible
                widget: string
                hint: "Ej: Almuerzos y cenas"

          # ── CARTA ───────────────────────────────────────────────
          - name: carta
            label: Carta
            label_singular: Plato
            widget: list
            fields:
              - name: categoria
                label: Categoría
                widget: select
                options:
                  - label: "Sabores de Andalucía"
                    value: "SABORES DE ANDALUCÍA"
                  - label: "Sopas y platos de cuchara"
                    value: "SOPAS Y PLATOS DE CUCHARA"
                  - label: "Entrantes y raciones"
                    value: "ENTRANTES Y RACIONES"
                  - label: "Frituras y pescados"
                    value: "FRITURAS Y PESCADOS"
                  - label: "Carnes"
                    value: "CARNES"
                  - label: "Huevos y tortillas"
                    value: "HUEVOS Y TORTILLAS"
                  - label: "Arroces"
                    value: "ARROCES"
                  - label: "Postres"
                    value: "POSTRES"

              - name: nombre
                label: Nombre del plato
                widget: string

              - name: descripcion
                label: Descripción
                widget: text
                hint: "2–3 frases. Lo que hace especial al plato."

              - name: maridaje
                label: Sugerencia de maridaje
                widget: string
                hint: "Ej: 🍷 Sugerencia: Copa de Fontedei Prado Negro (D.O. Granada) — 3,40€"

              - name: precio
                label: Precio
                widget: string
                hint: "Ej: 11,00€"

              - name: disponible
                label: ¿En carta hoy?
                widget: select
                options:
                  - label: "Sí — visible en web"
                    value: "SI"
                  - label: "No — ocultar temporalmente"
                    value: "NO"
                default: "SI"
