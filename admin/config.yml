backend:
  name: github
  repo: miriamsaxetech-code/bar-leon-cms
  branch: main
  auth_type: pkce
  app_id: REPLACE_WITH_GITHUB_CLIENT_ID

media_folder: assets/images
public_folder: assets/images

collections:
  - name: bar_leon
    label: Bar León
    files:

      - name: data_es
        label: Carta, Menú y Horarios (Español)
        file: data/es.json
        format: json
        fields:

          # ── INICIO ─────────────────────────────────────────────
          - name: inicio
            label: Página de Inicio
            widget: object
            fields:
              - name: titular
                label: Frase principal
                widget: string
                hint: "Una línea. Ej: Tres generaciones sin cambiar de receta."

              - name: subtitulo
                label: Subtítulo institucional
                widget: string
                hint: "No modificar salvo cambio de ubicación. Ej: Plaza Nueva · Granada"

              - name: avisoEspecial
                label: Aviso especial (opcional)
                widget: string
                required: false
                hint: "Dejar en blanco si no hay aviso activo."

          # ── MENÚ DEL DÍA ────────────────────────────────────────
          - name: menuDia
            label: Menú del Día
            widget: object
            fields:
              - name: disponible
                label: ¿Disponible hoy?
                widget: select
                options:
                  - label: "Sí — mostrar en web"
                    value: "SI"
                  - label: "No — ocultar en web"
                    value: "NO"
                default: "SI"

              - name: dias
                label: Días de servicio
                widget: string
                hint: "Ej: Lunes, Martes, Jueves y Viernes (Solo Mediodía)"

              - name: precio
                label: Precio
                widget: string
                hint: "Ej: 12,50€"

              - name: condiciones
                label: Condiciones
                widget: text
                hint: "Qué incluye el menú."

          # ── HORARIOS ────────────────────────────────────────────
          - name: horarios
            label: Horarios
            label_singular: Día
            widget: list
            fields:
              - name: dia
                label: Día
                widget: string

              - name: estado
                label: Estado
                widget: select
                options:
                  - ABIERTO
                  - CERRADO
                  - CERRADO TARDE

              - name: detalle
                label: Texto visible
                widget: string
                hint: "Ej: Almuerzos y cenas"

          # ── CARTA ───────────────────────────────────────────────
          - name: carta
            label: Carta
            label_singular: Plato
            widget: list
            fields:
              - name: categoria
                label: Categoría
                widget: select
                options:
                  - label: "Sabores de Andalucía"
                    value: "Sabores de Andalucía"
                  - label: "Entrantes y Sopas"
                    value: "Entrantes y Sopas"
                  - label: "Frituras y Pescados"
                    value: "Frituras y Pescados"
                  - label: "Carnes"
                    value: "Carnes"
                  - label: "Huevos y Tortillas"
                    value: "Huevos y Tortillas"
                  - label: "Arroces"
                    value: "Arroces"
                  - label: "Postres"
                    value: "Postres"
                  - label: "Vinos de Granada"
                    value: "Vinos de Granada"
                  - label: "Rioja"
                    value: "Rioja"
                  - label: "Ribera del Duero"
                    value: "Ribera del Duero"
                  - label: "Blancos y Generosos"
                    value: "Blancos y Generosos"
                  - label: "Cervezas"
                    value: "Cervezas"
                  - label: "Bebidas y Aperitivos"
                    value: "Bebidas y Aperitivos"

              - name: nombre
                label: Nombre del plato
                widget: string

              - name: descripcion
                label: Descripción
                widget: text
                hint: "2–3 frases. Lo que hace especial al plato."

              - name: maridaje
                label: Sugerencia de maridaje
                widget: string
                hint: "Ej: 🍷 Sugerencia: Copa de Fontedei Prado Negro (D.O. Granada) — 3,40€"

              - name: precio
                label: Precio
                widget: string
                hint: "Ej: 11,00€"

              - name: disponible
                label: ¿En carta hoy?
                widget: select
                options:
                  - label: "Sí — visible en web"
                    value: "SI"
                  - label: "No — ocultar temporalmente"
                    value: "NO"
                default: "SI"
