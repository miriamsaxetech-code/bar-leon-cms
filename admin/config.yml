backend:
  name: github
  repo: miriamsaxetech-code/bar-leon-cms
  branch: main
  base_url: https://bar-leon-cms.pages.dev

media_folder: assets/images
public_folder: assets/images

collections:
  - name: bar_leon
    label: Bar León
    files:

      - name: venue
        label: Carta, Menú y Horarios
        file: data/venue.json
        format: json
        fields:

          # ── MENÚ DEL DÍA ────────────────────────────────────────
          - name: daily_menu
            label: Menú del Día
            widget: object
            fields:
              - name: active
                label: ¿Mostrar menú del día?
                widget: boolean
                default: true
                hint: "Desactivar oculta el menú del día en la web."

              - name: price
                label: Precio
                widget: number
                value_type: float
                hint: "Ej: 12.5 (sin símbolo de moneda)"

              - name: includes
                label: Condiciones (ES)
                widget: object
                fields:
                  - name: es
                    label: Español
                    widget: text
                    hint: "Qué incluye el menú. Ej: IVA incluido. Bebida no incluida."

              - name: starters
                label: Primeros (opciones)
                widget: object
                fields:
                  - name: es
                    label: Español
                    widget: string
                    hint: "Separar con · (punto medio). Ej: Ensalada · Salmorejo"

              - name: seconds
                label: Segundos (opciones fijas)
                widget: object
                fields:
                  - name: es
                    label: Español
                    widget: string
                    hint: "Separar con · (punto medio)."

              - name: mains
                label: Platos del día (por día)
                label_singular: Día
                widget: list
                fields:
                  - name: day
                    label: Día (en inglés)
                    widget: select
                    options:
                      - { label: "Lunes", value: "monday" }
                      - { label: "Martes", value: "tuesday" }
                      - { label: "Jueves", value: "thursday" }
                      - { label: "Viernes", value: "friday" }
                  - name: name
                    label: Plato
                    widget: object
                    fields:
                      - name: es
                        label: Español
                        widget: string
                        hint: "Ej: Cocido"

              - name: desserts
                label: Postre (opciones)
                widget: object
                fields:
                  - name: es
                    label: Español
                    widget: string
                    required: false
                    hint: "Ej: Natillas · Arroz con leche · Helado · Fruta del tiempo"

              - name: seasonal
                label: Especiales de temporada (opcional)
                widget: object
                fields:
                  - name: es
                    label: Español
                    widget: string
                    required: false
                    hint: "Ej: Viernes en verano: Arroz a la cubana."

          # ── HORARIOS ────────────────────────────────────────────
          - name: hours
            label: Horarios
            label_singular: Día
            widget: list
            fields:
              - name: day
                label: Día
                widget: select
                options:
                  - { label: "Lunes",     value: "monday" }
                  - { label: "Martes",    value: "tuesday" }
                  - { label: "Miércoles", value: "wednesday" }
                  - { label: "Jueves",    value: "thursday" }
                  - { label: "Viernes",   value: "friday" }
                  - { label: "Sábado",    value: "saturday" }
                  - { label: "Domingo",   value: "sunday" }

              - name: status
                label: Estado
                widget: select
                options:
                  - { label: "Abierto",       value: "open" }
                  - { label: "Cerrado",        value: "closed" }
                  - { label: "Solo mediodía",  value: "partial" }

              - name: periods
                label: Franjas horarias
                label_singular: Franja
                widget: list
                required: false
                fields:
                  - name: open
                    label: Apertura
                    widget: string
                    hint: "Ej: 13:00"
                  - name: close
                    label: Cierre
                    widget: string
                    hint: "Ej: 16:00"

          # ── CARTA ───────────────────────────────────────────────
          - name: dishes
            label: Carta (platos)
            label_singular: Plato
            widget: list
            fields:
              - name: id
                label: ID (no modificar)
                widget: string
                hint: "Identificador único. No cambiar una vez creado."

              - name: category_id
                label: Categoría
                widget: select
                options:
                  - { label: "Sabores de Andalucía",      value: "andalusian-specialities" }
                  - { label: "Sopas y platos de cuchara", value: "soups-stews" }
                  - { label: "Entrantes y raciones",       value: "starters" }
                  - { label: "Frituras y pescados",         value: "fried-fish" }
                  - { label: "Carnes",                      value: "meats" }
                  - { label: "Huevos y tortillas",          value: "eggs-omelettes" }
                  - { label: "Arroces",                     value: "rice" }
                  - { label: "Postres",                     value: "desserts" }

              - name: name
                label: Nombre del plato
                widget: object
                fields:
                  - name: es
                    label: Español
                    widget: string

              - name: description
                label: Descripción
                widget: object
                fields:
                  - name: es
                    label: Español
                    widget: text
                    hint: "2–3 frases. Lo que hace especial al plato."

              - name: price
                label: Precio
                widget: string
                hint: "Ej: 11,00 € — o Media 7,50 € / Ración 10,00 €"

              - name: pairing
                label: Sugerencia de maridaje
                widget: object
                fields:
                  - name: es
                    label: Español
                    widget: string
                    required: false
                    hint: "Ej: Manzanilla — 3,50 €. Dejar vacío si no aplica."

              - name: available
                label: ¿En carta hoy?
                widget: boolean
                default: true
                hint: "Desactivar oculta el plato temporalmente."

          # ── AVISO ESPECIAL ──────────────────────────────────────
          - name: venue
            label: Aviso especial
            widget: object
            fields:
              - name: notice
                label: Aviso en página de inicio
                widget: object
                fields:
                  - name: es
                    label: Español
                    widget: string
                    required: false
                    hint: "Dejar en blanco si no hay aviso activo. Ej: Cerrado por vacaciones del 1 al 15 de agosto."
