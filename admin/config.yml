backend:
  name: github
  repo: miriamsaxetech-code/bar-leon-cms
  branch: main
  base_url: https://bar-leon-cms.pages.dev

media_folder: assets/images
public_folder: assets/images

collections:
  - name: bar_leon
    label: Bar León
    files:

      - name: venue
        label: Carta, Menú y Horarios
        file: data/venue.json
        format: json
        fields:

          # ── AVISO ESPECIAL — lo más urgente, arriba del todo ────
          - name: venue
            label: "⚠️ Aviso especial"
            widget: object
            collapsed: false
            hint: "Aparece destacado en la portada. Dejar vacío si no hay aviso."
            fields:
              - name: notice
                label: Aviso
                widget: object
                collapsed: false
                fields:
                  - name: es
                    label: Texto del aviso
                    widget: string
                    required: false
                    hint: "Ej: Cerrado por vacaciones del 1 al 15 de agosto. Vacío = sin aviso."

          # ── MENÚ DEL DÍA ────────────────────────────────────────
          - name: daily_menu
            label: "🍽️ Menú del día"
            widget: object
            collapsed: false
            fields:
              - name: active
                label: ¿Mostrar menú del día en la web?
                widget: boolean
                default: true
                hint: "Desactivar para ocultar el menú del día (ej: festivos, verano)."

              - name: price
                label: Precio del menú
                widget: number
                value_type: float
                hint: "Solo el número. Ej: 12.5"

              - name: starters
                label: Primeros (opciones del día)
                widget: object
                collapsed: false
                fields:
                  - name: es
                    label: Opciones de primeros
                    widget: string
                    hint: "Separar con · Ej: Ensalada · Salmorejo · Entremeses"

              - name: seconds
                label: Segundos (opciones del día)
                widget: object
                collapsed: false
                fields:
                  - name: es
                    label: Opciones de segundos
                    widget: string
                    hint: "Separar con · Ej: Filete · Calamares · Dorada"

              - name: mains
                label: Plato especial por día
                label_singular: Día
                widget: list
                summary: "{{fields.day}}: {{fields.name.es}}"
                collapsed: false
                fields:
                  - name: day
                    label: Día
                    widget: select
                    options:
                      - { label: "Lunes",   value: "monday" }
                      - { label: "Martes",  value: "tuesday" }
                      - { label: "Jueves",  value: "thursday" }
                      - { label: "Viernes", value: "friday" }
                  - name: name
                    label: Nombre del plato
                    widget: object
                    collapsed: false
                    fields:
                      - name: es
                        label: Plato
                        widget: string
                        hint: "Ej: Cocido"

              - name: desserts
                label: Postre (opciones)
                widget: object
                collapsed: false
                fields:
                  - name: es
                    label: Opciones de postre
                    widget: string
                    required: false
                    hint: "Ej: Natillas · Helado · Fruta del tiempo"

              - name: includes
                label: Condiciones del menú
                widget: object
                collapsed: true
                fields:
                  - name: es
                    label: Qué incluye
                    widget: text
                    hint: "Ej: IVA incluido. Bebida no incluida."

              - name: seasonal
                label: Nota de temporada (opcional)
                widget: object
                collapsed: true
                fields:
                  - name: es
                    label: Nota
                    widget: string
                    required: false
                    hint: "Ej: Viernes en verano: Arroz a la cubana."

          # ── HORARIOS ────────────────────────────────────────────
          - name: hours
            label: "🕐 Horarios"
            label_singular: Día
            widget: list
            summary: "{{fields.day}} — {{fields.status}}"
            collapsed: false
            fields:
              - name: day
                label: Día
                widget: select
                options:
                  - { label: "Lunes",     value: "monday" }
                  - { label: "Martes",    value: "tuesday" }
                  - { label: "Miércoles", value: "wednesday" }
                  - { label: "Jueves",    value: "thursday" }
                  - { label: "Viernes",   value: "friday" }
                  - { label: "Sábado",    value: "saturday" }
                  - { label: "Domingo",   value: "sunday" }

              - name: status
                label: Estado
                widget: select
                options:
                  - { label: "Abierto (comida y cena)", value: "open" }
                  - { label: "Solo mediodía",            value: "partial" }
                  - { label: "Cerrado",                  value: "closed" }

              - name: periods
                label: Franjas horarias
                label_singular: Franja
                widget: list
                required: false
                summary: "{{fields.open}} – {{fields.close}}"
                fields:
                  - name: open
                    label: Apertura
                    widget: string
                    hint: "Ej: 13:00"
                  - name: close
                    label: Cierre
                    widget: string
                    hint: "Ej: 16:00"

          # ── CARTA ───────────────────────────────────────────────
          - name: dishes
            label: "📋 Carta (platos)"
            label_singular: Plato
            widget: list
            summary: "{{fields.name.es}} · {{fields.price}}"
            collapsed: true
            fields:
              - name: available
                label: ¿En carta hoy?
                widget: boolean
                default: true
                hint: "Desactivar oculta el plato sin borrarlo."

              - name: name
                label: Nombre del plato
                widget: object
                collapsed: false
                fields:
                  - name: es
                    label: Nombre
                    widget: string

              - name: price
                label: Precio
                widget: string
                hint: "Ej: 11,00 € — o Media 7,50 € / Ración 10,00 €"

              - name: category_id
                label: Sección de la carta
                widget: select
                options:
                  - { label: "Sabores de Andalucía",      value: "andalusian-specialities" }
                  - { label: "Sopas y platos de cuchara", value: "soups-stews" }
                  - { label: "Entrantes y raciones",       value: "starters" }
                  - { label: "Frituras y pescados",         value: "fried-fish" }
                  - { label: "Carnes",                      value: "meats" }
                  - { label: "Huevos y tortillas",          value: "eggs-omelettes" }
                  - { label: "Arroces",                     value: "rice" }
                  - { label: "Postres",                     value: "desserts" }

              - name: description
                label: Descripción
                widget: object
                collapsed: true
                fields:
                  - name: es
                    label: Descripción del plato
                    widget: text
                    hint: "2–3 frases. Lo que hace especial al plato."

              - name: pairing
                label: Maridaje (opcional)
                widget: object
                collapsed: true
                fields:
                  - name: es
                    label: Sugerencia
                    widget: string
                    required: false
                    hint: "Ej: Manzanilla — 3,50 €. Vacío si no aplica."

              - name: id
                label: ID interno
                widget: string
                hint: "⚠️ No modificar. Identificador técnico del plato."
